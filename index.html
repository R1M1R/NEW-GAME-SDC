<!DOCTYPE html>
<html lang="ru" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#14110e">
  <meta name="google" content="notranslate">
  <meta name="description" content="Аурелия — idle merge и ремонт квартиры от черновой студии до пентхауса.">
  <title>Аурелия</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect rx='6' width='32' height='32' fill='%2314110e'/%3E%3Cpath d='M6 14 L16 6 L26 14 V26 H6Z' fill='none' stroke='%23e4b15a' stroke-width='2'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css?v=56">
  <script id="yandex-sdk" src="https://yandex.ru/games/sdk/v2" async></script>
</head>
<body>
  <div class="app" id="app">
    <div class="col col-left">
      <header class="brand-block">
        <div class="brand">
          <svg class="brand-mark" viewBox="0 0 64 64" aria-hidden="true">
            <rect x="4" y="4" width="56" height="56" rx="14" fill="#2a211a" stroke="#e4b15a" stroke-width="2"/>
            <path d="M14 36 L32 18 L50 36 V50 H14Z" fill="#1a2428" stroke="#f0d7a2" stroke-width="2"/>
            <path d="M28 50 V40 H36 V50" fill="#e4b15a"/>
            <circle cx="46" cy="16" r="4" fill="#f0d7a2"/>
          </svg>
          <div class="brand-copy">
            <p class="brand-title" data-i18n="meta.title">Аурелия</p>
            <p class="brand-tag" data-i18n="meta.tagline">От черновой студии до пентхауса</p>
          </div>
          <p class="room-chapter" id="room-chapter"></p>
        </div>
      </header>
      <section class="room" aria-labelledby="room-name">
        <canvas id="room-canvas" aria-hidden="true"></canvas>
        <div class="zone-layer" id="zone-layer">
          <button type="button" class="zone-pin" data-zone="window" id="zone-window"><b>Окно</b><em>0</em></button>
          <button type="button" class="zone-pin" data-zone="light" id="zone-light"><b>Свет</b><em>0</em></button>
          <button type="button" class="zone-pin" data-zone="soft" id="zone-soft"><b>Диван</b><em>0</em></button>
          <button type="button" class="zone-pin" data-zone="tech" id="zone-tech"><b>Техника</b><em>0</em></button>
          <button type="button" class="zone-pin" data-zone="floor" id="zone-floor"><b>Пол</b><em>0</em></button>
        </div>
        <button type="button" id="fuse-box" class="fuse-box" hidden>⚡</button>
        <div class="room-caption">
          <h1 class="room-name" id="room-name">Черновая студия</h1>
          <p class="room-next" id="room-next"></p>
          <p class="room-blurb" id="room-blurb">Голый бетон, коробки и первое ведро краски.</p>
        </div>
      </section>
      <section class="orders" id="orders" aria-labelledby="orders-kicker">
        <div class="orders-head">
          <span class="orders-kicker" id="orders-kicker">Заказы</span>
          <span class="orders-prestige" id="orders-prestige">Престиж +0%</span>
        </div>
        <div class="orders-list" id="orders-list"></div>
      </section>
      <section class="quest" id="quest">
        <div class="quest-row">
          <span class="quest-kicker" id="quest-kicker" data-i18n="quest.kicker">Квест</span>
          <span class="quest-title" id="quest-title">Первая смета</span>
          <span class="quest-count" id="quest-count">0 / 80</span>
        </div>
        <div class="quest-track" id="quest-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="quest-fill" id="quest-fill"></div>
        </div>
        <button type="button" id="quest-claim" class="quest-claim" hidden>Забрать награду</button>
      </section>
    </div>

    <div class="col col-right">
      <div class="currencies">
        <div class="pill pill-money" id="pill-money">
          <svg viewBox="0 0 32 32" aria-hidden="true">
            <circle cx="16" cy="16" r="12" fill="#e4b15a"/>
            <circle cx="16" cy="16" r="8" fill="none" stroke="#8a5a22" stroke-width="2"/>
            <path d="M16 9 V23 M12 13 H18.5 a3 3 0 0 1 0 6 H12" fill="none" stroke="#8a5a22" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
          <span>
            <small data-i18n="currency.money">Деньги</small>
            <b id="money-value">0</b>
          </span>
        </div>
        <div class="pill pill-crystal" id="pill-crystal">
          <svg viewBox="0 0 32 32" aria-hidden="true">
            <path d="M16 3 L26 12 L16 29 L6 12Z" fill="#7fd0d8"/>
            <path d="M16 3 L20 12 L16 29 L12 12Z" fill="#d9fbff" opacity="0.85"/>
          </svg>
          <span>
            <small data-i18n="currency.crystals">Кристаллы</small>
            <b id="crystal-value">0</b>
          </span>
        </div>
        <div class="pill pill-income" id="pill-income">
          <svg viewBox="0 0 32 32" aria-hidden="true">
            <path d="M8 22 L16 8 L24 22" fill="none" stroke="#8eae86" stroke-width="2.4" stroke-linejoin="round"/>
            <path d="M11 18 H21" stroke="#8eae86" stroke-width="2"/>
          </svg>
          <span>
            <small data-i18n="currency.income">Доход</small>
            <b id="income-value">0/с</b>
          </span>
          <em class="boost-badge" id="boost-badge" data-i18n="currency.boost">×2</em>
        </div>
      </div>
      <div class="spawn-row">
        <button type="button" id="btn-spawn" class="spawn-btn">
          <span data-i18n="play.spawn">Поставка</span>
          <strong id="spawn-count">15/15</strong>
        </button>
        <div class="energy-track" aria-hidden="true"><div id="energy-fill"></div></div>
      </div>
      <div class="inspire" id="inspire">
        <div class="inspire-track" aria-hidden="true"><div id="inspire-fill"></div></div>
        <span id="inspire-label">Вдохновение</span>
      </div>
      <div class="offer-row">
        <div class="offer-col">
          <button type="button" id="btn-x2" class="offer-btn" data-ad-button="x2">
            <span id="x2-label">🔥 Доход x2 на 2 минуты 🎬</span>
          </button>
          <div class="offer-track" aria-hidden="true"><div id="x2-fill"></div></div>
        </div>
        <div class="offer-col">
          <button type="button" id="btn-auto" class="offer-btn" data-ad-button="auto">
            <span id="auto-label">🤖 Авто-мерж на 60 секунд за видео 🎬</span>
          </button>
          <div class="offer-track" aria-hidden="true"><div id="auto-fill"></div></div>
        </div>
      </div>
      <section class="merge" aria-labelledby="merge-title">
        <div class="merge-head">
          <h2 class="merge-title" id="merge-title" data-i18n="grid.title">Мастерская</h2>
          <button type="button" id="btn-codex" class="codex-btn" data-i18n="monetize.codex">Коллекция</button>
          <span class="merge-count" id="grid-count">0 / 20</span>
        </div>
        <div class="merge-board">
          <canvas id="board-links" aria-hidden="true"></canvas>
          <div class="merge-grid" id="merge-grid" role="grid" aria-rowcount="4" aria-colcount="5"></div>
        </div>
      </section>
      <nav class="dock" aria-label="Aurelia">
      <div class="tabs" role="tablist">
        <button type="button" id="tab-upgrades" role="tab" aria-selected="false" aria-controls="sheet" data-tab="upgrades">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 16 L10 10 L13 13 L20 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M14 6 H20 V12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <span data-i18n="nav.upgrades">Прокачка</span>
        </button>
        <button type="button" id="tab-shop" role="tab" aria-selected="false" aria-controls="sheet" data-tab="shop">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8 H19 L17.5 19 H6.5Z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 8 V7 a4 4 0 0 1 8 0 V8" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
          <span data-i18n="nav.shop">Магазин</span>
        </button>
        <button type="button" id="tab-boosters" role="tab" aria-selected="false" aria-controls="sheet" data-tab="boosters">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 L14.2 8.8 L20 11 L14.2 13.2 L12 19 L9.8 13.2 L4 11 L9.8 8.8Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
          <span data-i18n="nav.boosters">Бустеры</span>
        </button>
      </div>
      <div class="tools">
        <button type="button" id="btn-sound" aria-pressed="true" data-i18n-aria="nav.soundOn" aria-label="Выключить звук">
          <svg id="icon-sound-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9 H8 L13 5 V19 L8 15 H4Z" fill="currentColor"/><path d="M16 9 a4 4 0 0 1 0 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <svg id="icon-sound-off" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M4 9 H8 L13 5 V19 L8 15 H4Z" fill="currentColor"/><path d="M16 10 L20 14 M20 10 L16 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <span data-i18n="nav.sound">Звук</span>
        </button>
        <button type="button" id="btn-lang" data-i18n-aria="nav.lang" aria-label="Переключить язык">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M4 12 H20 M12 4 a12 12 0 0 1 0 16 a12 12 0 0 1 0 -16" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
          <span id="lang-code">RU</span>
        </button>
      </div>
      </nav>
    </div>

    <button type="button" id="drone" class="drone" hidden data-ad-button="drone">🚁 Золотой дрон · VIP-заказчик 🎬</button>
    <div id="event-banner" class="event-banner" hidden>
      <strong id="event-title"></strong>
      <p id="event-copy"></p>
      <em id="event-timer"></em>
      <div class="event-actions" id="event-actions" hidden>
        <button type="button" id="deal-sell">Продать</button>
        <button type="button" id="deal-keep">Оставить</button>
      </div>
    </div>
    <div id="style-modal" class="style-modal" hidden>
      <button type="button" class="overlay-backdrop" id="style-backdrop" data-i18n-aria="nav.close" aria-label="Закрыть панель"></button>
      <div class="style-card" role="dialog" aria-modal="true" aria-labelledby="style-title">
        <div class="sheet-bar">
          <h2 class="sheet-title" id="style-title">Стиль</h2>
          <button type="button" class="sheet-close" id="style-close" data-i18n-aria="nav.close" aria-label="Закрыть панель">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6 L18 18 M18 6 L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          </button>
        </div>
        <p class="sheet-note" id="style-lead" data-i18n="design.styleLead">Выберите стиль. Комната перерисуется сразу.</p>
        <div class="style-choices" id="style-choices"></div>
      </div>
    </div>
    <div id="stage-warning" class="stage-warning" hidden></div>

    <div class="sheet-overlay" id="sheet-overlay" hidden inert>
      <button type="button" class="overlay-backdrop" id="sheet-backdrop" data-i18n-aria="nav.close" aria-label="Закрыть панель"></button>
      <section class="sheet" id="sheet" role="tabpanel" aria-hidden="true">
      <div class="sheet-bar">
        <h2 class="sheet-title" id="sheet-title">Прокачка</h2>
        <button type="button" class="sheet-close" id="sheet-close" data-i18n-aria="nav.close" aria-label="Закрыть панель">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6 L18 18 M18 6 L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="sheet-scroll" id="sheet-scroll"></div>
      </section>
    </div>

    <div class="toasts" id="toasts" aria-live="polite"></div>
    <div id="reveal" class="reveal" hidden>
      <button type="button" class="reveal-card" id="reveal-card">
        <canvas id="reveal-art" width="220" height="220"></canvas>
        <p class="reveal-kicker" id="reveal-kicker"></p>
        <h2 id="reveal-name"></h2>
        <p id="reveal-desc"></p>
      </button>
    </div>
    <div id="energy-offer" class="energy-offer" hidden>
      <button type="button" id="btn-energy-ad" class="offer-btn" data-ad-button="energy">⚡ Полный заряд + 3 редких предмета за видео 🎬</button>
      <button type="button" id="btn-energy-dismiss" class="energy-dismiss">Не сейчас</button>
    </div>
  </div>
  <div id="ad-root"></div>
  <div id="offline-root"></div>
  <script src="i18n.js?v=41"></script>
  <script src="audio.js?v=8"></script>
  <script src="graphics.js?v=25"></script>
  <script src="juice.js?v=8"></script>
  <script src="game.js?v=56"></script>
  <script src="sdk.js?v=8"></script>
  <script src="auto-qa.js?v=10"></script>
</body>
</html>
